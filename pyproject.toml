[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-text-foundation"
version = "0.1.0"
description = "Milestone 1 — Healthcare Text Extraction Foundation: Safe, Evidence-Preserving Clinical Text Extraction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Healthcare Multi-Agent Platform Engineering Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
healthcare-text = "healthcare_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live_api: marks tests requiring live external API access (skipped by default unless RUN_LIVE_API_TESTS=true)",
    "slow: marks slow-running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter or line-length soft limit)
    "UP042", # inherit from StrEnum
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
